[package]
name = "vero_ssz_lighthouse_py"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python bindings spike for Lighthouse SSZ stack"

[lib]
name = "vero_ssz_lighthouse_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
hex = "0.4"
ssz = { package = "ethereum_ssz", version = "0.9.1" }
ssz_derive = { package = "ethereum_ssz_derive", version = "0.9.0" }
ssz_types = "0.11.0"
tree_hash = "0.10.0"
tree_hash_derive = "0.10.0"
typenum = "1.19"
