[package]
name = "ssz_grandine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python bindings for Grandine SSZ"

[lib]
name = "ssz_grandine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
hex = "0.4"
typenum = "1.19"
ssz_grandine = { package = "ssz", git = "https://github.com/grandinetech/grandine.git", rev = "ec4fd9b" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
