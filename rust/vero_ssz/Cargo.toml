[package]
name = "vero_ssz"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust SSZ helpers for Vero, exposed to Python via PyO3"

[lib]
name = "vero_ssz"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde_json = "1.0"
ssz_rs = "0.9"
hex = "0.4"
